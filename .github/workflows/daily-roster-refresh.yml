name: FC26 günlük kadro kontrolü

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fc26-daily-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Gereksinimleri kur
        run: python -m pip install -r automation/requirements.txt

      - name: Kadroları kontrol et
        run: python automation/daily_refresh.py

      - name: Sonucu yayınla
        shell: pwsh
        run: |
          git diff --quiet -- docs/data.json automation/state/rosters.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Değişiklik yok."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json automation/state/rosters.json
          git commit -m "Günlük FC26 kadro verisini yenile"
          git push
